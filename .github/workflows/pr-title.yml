name: PR title

# squash 머지만 허용하는 레포라 머지 커밋 제목이 PR 제목을 그대로 물려받는다.
# 커밋 규칙에서 결정론적으로 도출되는 부분(gitmoji, 중복 `(#N)`, 브랜치 커밋이 합의한 scope)은
# 여기서 채워 넣고, 사람이 판단해야 하는 위반(이모지·타입 불일치, 이슈 제목 복사)만 실패로 알린다.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  issues: read
  pull-requests: write

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  normalize:
    name: Normalize + lint PR title
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Collect branch commit titles
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git log --pretty=%s "origin/$BASE_REF..$HEAD_SHA" > commit-titles.txt

      # 이슈 제목을 그대로 옮겨 온 PR 제목을 걸러내기 위해 연결된 이슈 제목을 읽어 둔다.
      - name: Look up linked issue title
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          issue="$(printf '%s' "$PR_BODY" \
            | grep -oiE '(closes|refs?)[[:space:]]+#[0-9]+' \
            | head -n1 | grep -oE '[0-9]+' || true)"
          if [ -n "$issue" ]; then
            if ! gh issue view "$issue" --json title --jq .title > issue-title.txt; then
              rm -f issue-title.txt
              echo "- 참조 이슈 #$issue 제목 조회에 실패해 검증할 수 없습니다. 권한과 API 상태를 확인한 뒤 다시 실행하세요." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi

      - name: Normalize + lint
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          CAN_EDIT_TITLE: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]' }}
        run: |
          args=(--title "$PR_TITLE")
          # 읽기 전용 실행에서는 선택 사항인 scope를 추론해 수정을 요구하지 않는다.
          if [ "$CAN_EDIT_TITLE" = "true" ]; then
            args+=(--commits-file commit-titles.txt)
          fi
          if [ -f issue-title.txt ]; then
            args+=(--issue-title "$(cat issue-title.txt)")
          fi

          # 보정과 위반 보고는 독립이다: 고칠 수 있는 건 고치고, 남은 위반으로 실패시킨다.
          if normalized="$(uv run python scripts/pr_title.py "${args[@]}" 2> messages.txt)"; then
            status=0
          else
            status=$?
          fi
          sed 's/^/- /' messages.txt | tee -a "$GITHUB_STEP_SUMMARY"

          # 보정 불가능한 위반이면 스크립트가 입력 제목을 그대로 돌려주므로 조건이 거짓이 된다.
          if [ "$normalized" != "$PR_TITLE" ]; then
            if [ "$CAN_EDIT_TITLE" = "true" ]; then
              gh pr edit "$PR_NUMBER" --title "$normalized"
              echo "- PR 제목을 \`$normalized\`로 보정했다" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- 읽기 전용 실행이므로 PR 제목을 직접 수정하세요: \`$normalized\`" >> "$GITHUB_STEP_SUMMARY"
              status=1
            fi
          fi
          exit "$status"
